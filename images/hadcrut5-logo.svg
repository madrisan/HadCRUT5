<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f77b4"/>
      <stop offset="55%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#d62728"/>
    </linearGradient>
    <clipPath id="planetClip">
      <circle cx="128" cy="128" r="104"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="24" fill="#ffffff" stroke="#e2e2e2" stroke-width="2"/>

  <!-- stylized planet motif, further back than the thermometer -->
  <g opacity="0.32">
    <circle cx="128" cy="128" r="104" fill="#4a90d9"/>
    <g clip-path="url(#planetClip)" fill="#4f9a48" stroke="#2f6b2a" stroke-width="1.5" stroke-linejoin="round">
      <!-- Europe + Asia (Eurasia) main landmass, with the Indian
           subcontinent and Indochina as the recognizable peninsulas -->
      <path d="M64,86 L78,46 L100,40 L135,38 L172,42 L200,50 L212,66
               L196,96 L172,112 L168,134 L150,154 L134,130 L124,88 L96,74 Z"/>
      <!-- Iberia, overlapping the main landmass and Italy generously so there's no seam -->
      <path d="M54,92 L42,68 L58,52 L92,62 L80,94 Z" stroke="none"/>
      <!-- Italy, overlapping the main landmass and Iberia generously so there's no seam -->
      <path d="M70,58 L64,90 L96,100 L110,70 Z" stroke="none"/>
      <!-- British Isles -->
      <ellipse cx="40" cy="58" rx="6" ry="8"/>
      <!-- Japan -->
      <ellipse cx="202" cy="94" rx="4" ry="9" transform="rotate(20 202 94)"/>
      <!-- Africa: Horn of Africa jut east, Gulf of Guinea indent west, tapering to the Cape;
           kept south of the Mediterranean gap -->
      <path d="M88,102 L112,100 L126,110 L134,122 L146,126 L130,134 L122,150 L114,168
               L104,188 L94,200 L86,184 L80,162 L76,140 L82,122 L78,108 Z"/>
    </g>
    <ellipse cx="128" cy="128" rx="104" ry="45" fill="none" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="128" cy="128" rx="55" ry="104" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="128" cy="128" r="104" fill="none" stroke="#2f4f6b" stroke-width="2.5"/>
  </g>

  <!-- background thermometer motif, positioned at 3/4 width -->
  <g opacity="0.42">
    <rect x="178" y="18" width="28" height="176" rx="14" fill="none" stroke="#6b6b6b" stroke-width="3.5"/>
    <circle cx="192" cy="210" r="24" fill="none" stroke="#6b6b6b" stroke-width="3.5"/>
    <path d="M192,80 L192,196" stroke="#d62728" stroke-width="14" stroke-linecap="round"/>
    <circle cx="192" cy="210" r="18" fill="#d62728"/>
    <line x1="210" y1="50" x2="220" y2="50" stroke="#6b6b6b" stroke-width="3.5"/>
    <line x1="210" y1="80" x2="220" y2="80" stroke="#6b6b6b" stroke-width="3.5"/>
    <line x1="210" y1="110" x2="220" y2="110" stroke="#6b6b6b" stroke-width="3.5"/>
    <line x1="210" y1="140" x2="220" y2="140" stroke="#6b6b6b" stroke-width="3.5"/>
    <line x1="210" y1="170" x2="220" y2="170" stroke="#6b6b6b" stroke-width="3.5"/>
  </g>

  <!-- HadCRUT5-style uncertainty band -->
  <polygon points="20,166 32,169 45,163 55,154 63,166 76,171 88,168 100,164 113,161 125,159 137,154 150,162 162,165 174,164 187,158 199,151 211,143 224,134 230,126 236,123
                    236,133 230,138 224,146 211,157 199,165 187,174 174,180 162,183 150,182 137,174 125,181 113,183 100,188 88,192 76,197 63,194 55,182 45,193 32,199 20,198"
           fill="#9e9e9e" opacity="0.28"/>

  <!-- zero-anomaly baseline -->
  <line x1="20" y1="170" x2="236" y2="170" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="2,5"/>

  <!-- temperature anomaly trend line -->
  <polyline points="20,182 32,184 45,178 55,168 63,180 76,184 88,180 100,176 113,172 125,170 137,164 150,172 162,174 174,172 187,166 199,158 211,150 224,140 230,132 236,128"
            fill="none" stroke="url(#warmGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="236" cy="128" r="7" fill="#d62728"/>
</svg>
